syntax = "proto3";

package counters.v1;
option go_package = "highload-counters/api/gen/counters/v1;countersv1";

// Test mode uses x-user-id metadata; bearer mode uses authorization metadata.
service CounterService {
  rpc LikePost(LikeRequest) returns (LikeResponse);
  rpc UnlikePost(LikeRequest) returns (LikeResponse);
  rpc RecordViews(RecordViewsRequest) returns (RecordViewsResponse);
  rpc GetCounters(GetCountersRequest) returns (GetCountersResponse);
}
message LikeRequest { int64 post_id = 1; }
message LikeResponse { int64 post_id = 1; bool liked = 2; }
message ViewEvent { int64 post_id = 1; int64 viewer_id = 2; }
message RecordViewsRequest { repeated ViewEvent events = 1; } // 1..50 events.
message RecordViewsResponse { int32 accepted = 1; int32 duplicates = 2; }
message GetCountersRequest { repeated int64 post_ids = 1; } // 1..100 unique IDs.
message Counter { int64 post_id = 1; int64 likes = 2; int64 views = 3; bool liked_by_me = 4; }
message GetCountersResponse { repeated Counter counters = 1; }
