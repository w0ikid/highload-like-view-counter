services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-counters}
      POSTGRES_USER: ${POSTGRES_USER:-counters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-counters_local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-counters}:${POSTGRES_PASSWORD:-counters_local}@postgres:5432/${POSTGRES_DB:-counters}?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    build: .
    profiles: ["tools"]
    entrypoint: ["/app/seed"]
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-counters}:${POSTGRES_PASSWORD:-counters_local}@postgres:5432/${POSTGRES_DB:-counters}?sslmode=disable
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-counters}:${POSTGRES_PASSWORD:-counters_local}@postgres:5432/${POSTGRES_DB:-counters}?sslmode=disable
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-1s}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT:-500ms}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-100ms}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
