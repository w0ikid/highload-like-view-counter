services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-counters}
      POSTGRES_USER: ${POSTGRES_USER:-counters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-counters_local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025", "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"]
  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-counters}:${POSTGRES_PASSWORD:-counters_local}@postgres:5432/${POSTGRES_DB:-counters}?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    build: .
    profiles: ["tools"]
    entrypoint: ["/app/seed"]
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-counters}:${POSTGRES_PASSWORD:-counters_local}@postgres:5432/${POSTGRES_DB:-counters}?sslmode=disable
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    entrypoint: ["/app/worker"]
    restart: on-failure
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-counters}:${POSTGRES_PASSWORD:-counters_local}@postgres:5432/${POSTGRES_DB:-counters}?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-counters}
      VIEW_TTL: ${VIEW_TTL:-1h}
      FLUSH_INTERVAL: ${FLUSH_INTERVAL:-1s}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-1m}
      WORKER_BUDGET: ${WORKER_BUDGET:-5s}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT:-500ms}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-100ms}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  api:
    build: .
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9090:9090"]
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-counters}:${POSTGRES_PASSWORD:-counters_local}@postgres:5432/${POSTGRES_DB:-counters}?sslmode=disable
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
      COUNTER_AUTH_MODE: ${COUNTER_AUTH_MODE:-bearer}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-counters}
      VIEW_TTL: ${VIEW_TTL:-1h}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-15m}
      AUTH_TIMEOUT: ${AUTH_TIMEOUT:-5s}
      SMTP_ADDR: mailhog:1025
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-2s}
      MAIL_FROM: ${MAIL_FROM:-no-reply@counters.local}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-1s}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT:-500ms}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-100ms}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
